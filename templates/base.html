<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#06101d">
<title>{% block title %}ShadowNet{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="bg-grid"></div>
<header class="nav">
  <a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">S</span> ShadowNet <small>EST. 2017</small></a>
  <nav>
    {% if user %}
      <a href="{{ url_for('dashboard') }}">Master Class</a>
      <a href="{{ url_for('premium') }}">Premium</a>
      <form action="{{ url_for('logout') }}" method="post" class="inline"><input type="hidden" name="csrf" value="{{ csrf_token }}"><button class="link-btn">Sign out</button></form>
    {% else %}
      <a href="{{ url_for('login') }}">Sign in</a>
      <a class="nav-cta" href="{{ url_for('register') }}">Create account</a>
    {% endif %}
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
<footer>
  <span>© 2017 ShadowNet. All rights reserved.</span>
  <span><a href="{{ url_for('privacy') }}">Privacy</a> · <a href="{{ url_for('terms') }}">Terms</a></span>
</footer>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
